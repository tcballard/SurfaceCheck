[package]
name = "surfacecheck"
version = "0.1.0"
edition = "2021"
description = "Deterministic post-release consistency checks for public software surfaces"
license = "MIT"
repository = "https://github.com/tcballard/surfacecheck"
keywords = ["release", "documentation", "cli", "github", "verification"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
